name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python tools (ruff + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install ruff==0.15.20 pillow==13.0.0
      - name: ruff
        run: ruff check tools
      - name: pyright (same engine as Pylance)
        run: npx -y pyright@1.1.400 -p pyrightconfig.json

  packs:
    name: Pack checks (validate, bpcheck, simulate, render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==13.0.0

      - name: Vanilla version
        id: vanilla
        run: echo "version=$(python -I tools/getvanilla.py --version)" >> "$GITHUB_OUTPUT"
      - name: Cache vanilla packs
        uses: actions/cache@v4
        with:
          path: vanilla
          key: bedrock-samples-${{ steps.vanilla.outputs.version }}
      - name: Download vanilla packs (bedrock-samples)
        run: python -I tools/getvanilla.py

      - name: validate (resource pack)
        run: python -I tools/validate.py
      - name: bpcheck (behavior pack)
        run: python -I tools/bpcheck.py
      - name: simulate (variants per mob, with and without BP)
        run: python -I tools/simulate.py

      - name: package (manifests + .mcpack/.mcaddon)
        run: python -I tools/package.py

      - name: render every mob
        run: |
          status=0
          for f in RP/entity/*.entity.json; do
            mob=$(basename "$f" .entity.json)
            python tools/render.py "$mob" --max 12 --size 192 || status=1
          done
          exit $status
      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: tools/out/*.png
          retention-days: 14
